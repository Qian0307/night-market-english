<title>英文小鎮句子餐車</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:linear-gradient(#bfe6ff 0%,#eaf8ff 45%,#fff7e0 100%);min-height:100vh;color:#2b2b3a}
#app{max-width:900px;margin:0 auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border-radius:18px;padding:10px 16px;box-shadow:0 3px 0 #cfe3f0;font-weight:700}
.top .pill{background:#fff3c4;border-radius:999px;padding:4px 14px;font-size:18px}
.scene{background:linear-gradient(#9fd8ff,#d8f1ff);border-radius:22px;margin:12px 0;padding:14px;text-align:center;box-shadow:0 4px 0 #8cc3e6;position:relative;min-height:120px}
.scene .truck{font-size:64px;line-height:1}
.scene .deco{font-size:30px;letter-spacing:6px;min-height:38px}
.scene .sign{font-weight:800;font-size:18px;color:#2a5d84}
.card{background:#fff;border-radius:22px;padding:20px;margin:12px 0;box-shadow:0 4px 0 #e2d8bb}
h1{margin:6px 0;font-size:30px}
h2{margin:4px 0 10px;font-size:24px}
.btn{font:inherit;font-weight:800;font-size:20px;border:0;border-radius:16px;padding:12px 22px;margin:5px;cursor:pointer;background:#ffb703;color:#3a2a00;box-shadow:0 4px 0 #d18f00}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d18f00}
.btn.green{background:#6bd68a;box-shadow:0 4px 0 #3fa860;color:#0c3a1a}
.btn.blue{background:#7cc4ff;box-shadow:0 4px 0 #4b95d1;color:#0b2c4a}
.btn.gray{background:#e4e4ea;box-shadow:0 4px 0 #b9b9c4;color:#333}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.daybtn{background:#fff;border:3px solid #ffd166;border-radius:18px;padding:12px;text-align:center;cursor:pointer;font:inherit;font-weight:700}
.daybtn.done{background:#e4ffe9;border-color:#6bd68a}
.daybtn.next{border-color:#ff7a59;box-shadow:0 0 0 4px #ffd9cf}
.daybtn .e{font-size:38px}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.vc{background:#fffaf0;border:2px dashed #ffcf6b;border-radius:16px;padding:10px;text-align:center;cursor:pointer}
.vc .e{font-size:40px}
.vc .w{font-size:22px;font-weight:800}
.vc .z{font-size:15px;color:#666}
.bubble{background:#fff;border:3px solid #333;border-radius:24px;padding:14px 18px;font-size:26px;font-weight:800;position:relative;margin:6px 0 10px}
.who{display:flex;align-items:center;gap:14px}
.who .face{font-size:72px}
.hint-line{color:#666;font-size:16px}
.big-input{font:inherit;font-size:26px;width:100%;padding:12px 14px;border-radius:14px;border:3px solid #7cc4ff;outline:none}
.big-input:focus{border-color:#ff7a59}
.fill-line{font-size:28px;font-weight:800;line-height:2.2}
.fill-line input{font:inherit;font-size:28px;width:150px;text-align:center;border:0;border-bottom:4px solid #ff7a59;background:#fff3ee;border-radius:8px;outline:none}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px;border-radius:14px}
.tiles.ans{background:#eef7ff;border:3px dashed #7cc4ff}
.tile{font:inherit;font-size:24px;font-weight:800;padding:8px 16px;border-radius:12px;border:0;background:#ffe08a;box-shadow:0 3px 0 #d6b24a;cursor:pointer}
.bad{color:#e63946;font-weight:800;text-decoration:line-through}
.mask{color:#2a7de1;font-weight:800}
.good{color:#1a9d4a;font-weight:800}
.msg{font-size:20px;margin:10px 0;line-height:1.7}
.big-en{font-size:34px;font-weight:800;color:#1a5fb4;margin:8px 0}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#2b2b3a;color:#fff;padding:10px 22px;border-radius:999px;font-weight:800;font-size:20px;z-index:9;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
textarea.report{width:100%;height:230px;font:inherit;font-size:15px;border-radius:12px;border:2px solid #ccc;padding:10px}
.progress{height:14px;background:#e6eef5;border-radius:999px;overflow:hidden;margin-top:8px}
.progress>div{height:100%;background:#6bd68a;transition:width .3s}
.bounce{animation:bn .7s ease 2}
@keyframes bn{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shop{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:8px 0;font-size:20px;font-weight:700}
small.s{color:#777;font-weight:500}
</style>
</head>

const CONTR={"i'm":'i am',"you're":'you are',"he's":'he is',"she's":'she is',"it's":'it is',"we're":'we are',"they're":'they are',"that's":'that is',"what's":'what is'};
function norm(s){
  s=String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
  if(!s) return [];
  const out=[]; s.split(' ').forEach(w=>{ if(CONTR[w]) out.push(...CONTR[w].split(' ')); else out.push(w.replace(/^'+|'+$/g,'')); });
  return out.filter(Boolean);
}
function lcsFlags(a,b){ // 回傳 a、b 各自哪些位置在最長共同子序列內
  const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--) dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const fa=Array(n).fill(false),fb=Array(m).fill(false); let i=0,j=0;
  while(i<n&&j<m){ if(a[i]===b[j]){fa[i]=fb[j]=true;i++;j++;} else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
  return [fa,fb];
}
function targets(q){ return [q.full].concat(q.alts||[]); }
function isCorrect(q,sentence){ const s=norm(sentence).join(' '); return targets(q).some(t=>norm(t).join(' ')===s); }
function bestTarget(q,sentence){ const s=norm(sentence); let best=q.full,sc=-1; targets(q).forEach(t=>{const [fa]=lcsFlags(norm(t),s); const c=fa.filter(Boolean).length; if(c>sc){sc=c;best=t;}}); return best; }
function checkFree(q,sentence){
  const toks=norm(sentence); const flat=toks.join(' ');
  if(toks.length<q.min) return false;
  return q.all.every(r=>new RegExp(r).test(flat));
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function say(t){try{if(!('speechSynthesis' in window)){return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u);}catch(e){}}
let ac=null;
function beep(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';const t=ac.currentTime;
  if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(880,t+.1);}else{o.frequency.setValueAtTime(220,t);}
  g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);}catch(e){}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800);}

/* ====================== 存檔 ====================== */
const KEY='xy_english_town_v1';
let SAVE={coins:0,bought:[],done:{},log:{},stickers:[],bosses:[]}; // done[dayIdx]=首次通關星數; log[dayIdx]=[{full,res,wrong,free}]
try{const r=localStorage.getItem(KEY); if(r) SAVE=Object.assign(SAVE,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(SAVE));}catch(e){}}

/* ====================== 狀態 ====================== */
let G=null; // 目前遊玩中的狀態
const app=document.getElementById('app');

function isBoss(qi,d){ return qi>=d.items.length-3; }
function hearts(n){ return '❤️'.repeat(n)+'🖤'.repeat(3-n); }
function topBar(extra){
  return `<div class="top"><div>🏘️ 英文小鎮句子餐車</div><div>${extra||''}<span class="pill">🪙 ${SAVE.coins}</span></div></div>`;
}
function sceneHtml(sign){
  const deco=SAVE.bought.map(i=>SHOP[i][0]).join(' ');
  return `<div class="scene"><div class="deco">${deco||'&nbsp;'}</div><div class="truck">🚚</div><div class="sign">${esc(sign||'軒瑀的句子餐車')}</div></div>`;
}

   <button class="btn" onclick="viewAlbum()">📒 客人圖鑑 ${SAVE.stickers.length}/${DAYS.reduce((s,d)=>s+d.items.length,0)}</button>

/* ====================== 畫面：單字預習 ====================== */
function startDay(i){
  G={day:i,qi:0,tries:0,hints:0,res:[],order:null,hp:3,combo:0,maxCombo:0};
  const d=DAYS[i];
  app.innerHTML=topBar(`Day ${i+1} `)+sceneHtml(d.sign)+
  `<div class="card"><h2>${d.emoji} Day ${i+1}：${d.name}</h2>
   <div class="msg">📖 ${esc(STORY[i])}</div>
   <div class="msg">今天的 Boss：${BOSSES[i][1]} <b>${BOSSES[i][0]}</b>（最後 3 位客人是 Boss 回合，答對就能攻擊牠！）</div>
   <div class="msg">先看看今天會用到的字，點一下可以聽發音 🔊。準備好就開店！</div>
   <div class="vocab">${d.vocab.map(v=>`<div class="vc" onclick="say('${v[0].replace(/'/g,"\\'").replace(/[….]/g,'')}')"><div class="e">${v[1]}</div><div class="w">${esc(v[0])}</div><div class="z">${esc(v[2])}</div></div>`).join('')}</div>
   <p><button class="btn green" onclick="nextQ(true)">🚚 開店營業！</button> <button class="btn gray" onclick="viewMenu()">回選單</button></p></div>`;
}

/* ====================== 畫面：客人 ====================== */
function nextQ(first){
  const d=DAYS[G.day];
  if(!first) G.qi++;
  if(G.qi>=d.items.length) return viewSummary();
  G.tries=0; G.hints=0; G.fb=''; G.peek=false; G.spoke=false;
  const q=d.items[G.qi];
  if(q.t==='order'){
    const words=q.full.replace(/[.?!]/g,'').split(' ');
    let sh=shuffle(words); let k=0; while(sh.join(' ')===words.join(' ')&&k++<10) sh=shuffle(words);
    G.pool=sh.map((w,i)=>({w,id:i})); G.chosen=[];
  }
  renderQ();
}
function renderQ(){
  const d=DAYS[G.day], q=d.items[G.qi], c=CUSTOMERS[(G.day*3+G.qi)%CUSTOMERS.length];
  const pct=Math.round(G.qi/d.items.length*100);
  let body='';
  if(q.t==='order'){
    body=`<div class="msg">用單字磁鐵排出正確的句子（點單字放上去，點上面的字可以拿回來）</div>
    <div class="tiles ans" id="ans">${G.chosen.map(t=>`<button class="tile" onclick="unpick(${t.id})">${esc(t.w)}</button>`).join('')}</div>
    <div class="tiles" id="pool">${G.pool.filter(t=>!G.chosen.find(x=>x.id===t.id)).map(t=>`<button class="tile" onclick="pick(${t.id})">${esc(t.w)}</button>`).join('')}</div>`;
  } else if(q.t==='fill'){
    body=`<div class="msg">把空格補起來，打出缺的那個字：</div>
    <div class="fill-line">${esc(q.pre)} <input id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"> ${esc(q.post)}</div>`;
  } else if(q.t==='listen'){
    body=`<div class="msg">👂 客人小聲說了一句英文！聽清楚，然後<b>一字不漏</b>打出來。<br><button class="btn blue" onclick="say(${esc(JSON.stringify(q.full))})">🔊 再聽一次</button> <button class="btn gray" onclick="peekZh()">👀 看中文提示</button></div>
    <input class="big-input" id="inp" autocomplete="off" autocapitalize="sentences" autocorrect="off" spellcheck="false" placeholder="你聽到什麼？打在這裡…">`;
  } else if(q.t==='type'){
    body=`<div class="msg">把客人的話，用英文<b>整句打出來</b>吧！（記得：開頭大寫、最後加句點或問號）</div>
    <input class="big-input" id="inp" autocomplete="off" autocapitalize="sentences" autocorrect="off" spellcheck="false" placeholder="在這裡打英文…">`;
  } else {
    body=`<div class="msg">⭐ 加分關！自己想一個句子。<br><small class="s">${esc(q.tip)}</small></div>
    <input class="big-input" id="inp" autocomplete="off" autocapitalize="sentences" autocorrect="off" spellcheck="false" placeholder="在這裡打你的句子…">`;
  }
  const boss=isBoss(G.qi,d), B=BOSSES[G.day];
  const bossBar=boss?`<div class="msg" style="background:#ffe5e5;border-radius:14px;padding:8px 14px"><b>${B[1]} Boss「${B[0]}」</b>　${hearts(G.hp)}　<small class="s">答對就能攻擊！</small></div>`:'';
  app.innerHTML=topBar(`Day ${G.day+1}　第 ${G.qi+1}/${d.items.length} 位 ${G.combo>=2?'🔥連擊 '+G.combo+' ':''}`)+sceneHtml(d.sign)+
  `<div class="card">${bossBar}<div class="progress"><div style="width:${pct}%"></div></div>
    <div class="who"><div class="face">${c[1]}</div><div style="flex:1"><div class="hint-line">${c[0]} 說：</div>
    <div class="bubble" id="bub">${q.t==='listen'&&!G.peek?q.emoji+' 🔊 …（仔細聽）':q.emoji+' '+esc(q.zh)}</div></div></div>
    ${body}
    <div class="msg" id="fb">${G.fb||''}</div>
    <p><button class="btn green" id="go" onclick="submit()">✔ 送出</button>
       ${q.t!=='free'?`<button class="btn blue" onclick="hint()">💡 提示</button>`:''}
       <button class="btn gray" onclick="viewMenu()">離開</button></p></div>`;
  const inp=document.getElementById('inp'); if(inp){inp.focus(); inp.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});}
  if(q.t==='listen'&&!G.spoke){G.spoke=true;say(q.full);}
}
function peekZh(){ G.peek=true; G.hints++; const q=DAYS[G.day].items[G.qi]; document.getElementById('bub').textContent=q.emoji+' '+q.zh; }
function pick(id){const t=G.pool.find(x=>x.id===id); if(t&&!G.chosen.find(x=>x.id===id)){G.chosen.push(t);renderQ();}}
function unpick(id){G.chosen=G.chosen.filter(x=>x.id!==id);renderQ();}

function currentSentence(){
  const q=DAYS[G.day].items[G.qi];
  if(q.t==='order') return G.chosen.map(t=>t.w).join(' ')+(G.chosen.length?q.full.slice(-1):'');
  const v=(document.getElementById('inp')||{value:''}).value.trim();
  if(q.t==='fill') return (q.pre+' '+v+' '+q.post).trim();
  return v;
}
function rawInput(){const e=document.getElementById('inp');return e?e.value.trim():'';}
function maskWord(w){const core=w.replace(/[^A-Za-z']/g,'');return core.length<=1?core:core[0]+'＿'.repeat(core.length-1);}

function hint(){
  const q=DAYS[G.day].items[G.qi]; G.hints++;
  const t=norm(q.full); const showN=Math.min(G.hints,t.length);
  let s=q.full.split(' ').map((w,i)=>i<showN?w:maskWord(w)).join(' ');
  document.getElementById('fb').innerHTML=`💡 提示：<span class="mask">${esc(s)}</span>`;
}

function submit(){
  const d=DAYS[G.day], q=d.items[G.qi];
  if(G.copyMode) return submitCopy();
  const sent=currentSentence();
  if((q.t==='order'&&!G.chosen.length)||(q.t!=='order'&&!rawInput())){
    const fb=document.getElementById('fb'); fb.textContent='先把答案寫出來，再按送出喔！'; return;
  }
  // 自創句
  if(q.t==='free'){
    if(checkFree(q,sent)){ return finishQ(G.tries===0?'first':'second',[],sent); }
    G.tries++;
    if(G.tries>=3){ return finishQ('miss',[],sent); }
    beep(false);
    document.getElementById('fb').innerHTML=`再想想看～要符合：${esc(q.tip)}`;
    shake(); return;
  }
  if(isCorrect(q,sent)){
    return finishQ(G.tries===0?'first':'second',[],rawInputOrSent(q,sent));
  }
  // 錯了
  G.tries++; beep(false); shake();
  const tgt=bestTarget(q,sent), a=norm(tgt), b=norm(sent);
  const [fa,fb2]=lcsFlags(a,b);
  const wrongWords=a.filter((w,i)=>!fa[i]);
  G.lastWrong=(G.lastWrong||[]); wrongWords.forEach(w=>{ if(!G.curWrong) G.curWrong=[]; if(!G.curWrong.includes(w)) G.curWrong.push(w); });
  if(G.tries>=2){ // 兩次都錯：顯示答案，要求抄寫訂正
    G.copyMode=true; G.missSentence=sent;
    document.getElementById('fb').innerHTML=`這一題的答案是：<div class="big-en">${esc(tgt)}</div>🔊 聽一聽，然後<b>自己打一次</b>訂正。`;
    say(tgt);
    swapToCopyInput(); return;
  }
  const studentHtml=b.map((w,i)=>fb2[i]?`<span class="good">${esc(w)}</span>`:`<span class="bad">${esc(w)}</span>`).join(' ');
  const maskHtml=tgt.split(' ').map((w,i)=>fa[i]?esc(w):`<span class="mask">${esc(maskWord(w))}</span>`).join(' ');
  document.getElementById('fb').innerHTML=`差一點點！<br>你寫的：${studentHtml}<br>提示：${maskHtml}<br>紅色的字再想一想，再試一次！`;
  if(q.t==='order'){ G.chosen=[]; renderQMsgKeep(document.getElementById('fb').innerHTML); }
  else { const inp=document.getElementById('inp'); inp.select&&inp.select(); }
}
function rawInputOrSent(q,sent){return q.t==='order'||q.t==='fill'?sent:rawInput();}
function renderQMsgKeep(html){G.fb=html;renderQ();G.fb='';}
function shake(){const c=document.querySelector('.card:last-of-type');if(c){c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');}}

function swapToCopyInput(){
  const q=DAYS[G.day].items[G.qi];
  const box=document.querySelector('.card:last-of-type');
  // 保留氣泡，替換作答區
  let area=document.getElementById('inp');
  if(q.t==='order'){
    document.getElementById('ans').outerHTML=`<input class="big-input" id="inp" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="自己把答案打一次…">`;
    const p=document.getElementById('pool'); if(p)p.remove();
  } else if(q.t==='fill'){
    const fl=document.querySelector('.fill-line'); if(fl) fl.outerHTML=`<input class="big-input" id="inp" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="自己把整句打一次…">`;
  } else { area.value=''; area.placeholder='自己把答案打一次…'; }
  const inp=document.getElementById('inp'); inp.value=''; inp.focus();
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
}
function submitCopy(){
  const q=DAYS[G.day].items[G.qi]; const v=rawInput();
  if(isCorrect(q,v)){ G.copyMode=false; return finishQ('miss',G.curWrong||[],v); }
  beep(false); shake(); document.getElementById('fb').insertAdjacentHTML('beforeend','<div class="bad" style="text-decoration:none">還不一樣喔，看著答案再打一次。</div>');
}

function finishQ(res,wrong,sentence){
  const d=DAYS[G.day], q=d.items[G.qi];
  let pts=res==='first'?3:res==='second'?2:0, bonus=0;
  if(res==='first'){ G.combo++; G.maxCombo=Math.max(G.maxCombo,G.combo); if(G.combo>=5) bonus+=2; else if(G.combo>=3) bonus+=1; } else G.combo=0;
  const boss=isBoss(G.qi,d); let hit=false;
  if(boss&&res!=='miss'&&G.hp>0){ G.hp--; hit=true; }
  if(res!=='miss'){ const k=G.day+'-'+G.qi; if(!SAVE.stickers.includes(k)) SAVE.stickers.push(k); }
  if(q.t!=='order'&&q.t!=='fill'&&res!=='miss'){ const r=sentence; if(/^[A-Z]/.test(r)&&/[.?!]$/.test(r)) bonus+=1; }
  G.res.push({full:q.t==='free'?'':q.full,zh:q.zh,res,wrong:(G.curWrong||wrong||[]).slice(0,4),free:q.t==='free'?sentence:'',hints:G.hints,pts:pts+bonus,free_ok:q.t==='free'?res!=='miss':null});
  G.curWrong=null;
  SAVE.coins+=pts+bonus; save();
  if(res!=='miss'){ beep(true); toast(`+${pts+bonus} 🪙${G.combo>=3?'  🔥連擊 '+G.combo:''}`); }
  // 唸一唸畫面
  const say_text=q.t==='free'?sentence:q.full;
  const c=CUSTOMERS[(G.day*3+G.qi)%CUSTOMERS.length];
  const B=BOSSES[G.day];
  const react=res==='miss'?'🤔':['😋','🥰','🤩','😍'][G.qi%4];
  const bossHtml=boss?`<div class="msg" style="background:#ffe5e5;border-radius:14px;padding:8px 14px">${hit?`⚔️ 你攻擊了 ${B[1]} <b>${B[0]}</b>！`:`${B[1]} ${B[0]} 沒受傷…`}　${hearts(G.hp)}${G.hp===0?'<br><b>🎉 Boss 被打敗了！</b>':''}</div>`:'';
  const praise=res==='first'?'太棒了！一次就對！🎉':res==='second'?'答對了！很會修正！👍':'訂正完成！下次會更好 💪';
  app.innerHTML=topBar(`Day ${G.day+1}　第 ${G.qi+1}/${d.items.length} 位 `)+sceneHtml(d.sign)+
  `<div class="card">${bossHtml}<div class="who"><div class="face bounce">${c[1]}</div><div class="face bounce" style="animation-delay:.2s">${q.emoji}</div><div class="face">${react}</div></div>
   <div class="bubble">${praise}${G.combo>=3?`　🔥 連擊 ${G.combo}！`:''}</div>
   <div class="big-en">${esc(say_text)}</div>
   <div class="msg">${esc(q.zh.replace(/^自己造句：|^終極挑戰：/,''))}<br>🔊 聽一聽，然後<b>大聲唸一次</b>給老師聽！</div>
   <p><button class="btn blue" onclick="say(${esc(JSON.stringify(say_text))})">🔊 再聽一次</button>
   <button class="btn green" id="nx" onclick="nextQ(false)">🗣️ 我唸好了 → 下一位</button></p></div>`;
  say(say_text);
}

/* ====================== 結算 ====================== */
function dayReport(i,res){
  const d=DAYS[i]; const first=res.filter(r=>r.res==='first').length;
  let t=`【軒瑀 英文小鎮 Day ${i+1}：${d.name}】\n完成 ${res.length}/${d.items.length} 位客人，一次就對 ${first} 位。\n`;
  const weak=res.filter(r=>r.res!=='first'&&r.full);
  if(weak.length){ t+='需要再練的句子：\n'; weak.forEach((r,k)=>{ t+=`${k+1}. ${r.full}${r.res==='miss'?'（兩次沒答對）':'（第二次答對）'}${r.wrong&&r.wrong.length?' 卡在：'+r.wrong.join(', '):''}\n`; }); }
  else t+='所有題目都一次答對！\n';
  const fr=res.filter(r=>r.free);
  if(fr.length){ t+='自創句（請 Qian 看一下）：\n'; fr.forEach(r=>{t+=`- ${r.free}${r.free_ok?'':'（沒符合題目要求）'}\n`;}); }
  const hs=res.reduce((s,r)=>s+(r.hints||0),0); if(hs) t+=`提示使用 ${hs} 次。\n`;
  return t.trim();
}
function viewSummary(){
  const i=G.day, d=DAYS[i]; const first=G.res.filter(r=>r.res==='first').length;
  const stars=first>=7?3:first>=5?2:first>=3?1:0;
  if(!(i in SAVE.done)||SAVE.done[i]<stars) SAVE.done[i]=Math.max(stars,0);
  const defeated=G.hp===0; let bossBonus=0;
  if(defeated){ bossBonus=5; SAVE.coins+=5; if(!SAVE.bosses.includes(i)) SAVE.bosses.push(i); }
  SAVE.log[i]=dayReport(i,G.res)+`\nBoss「${BOSSES[i][0]}」：${defeated?'打敗了！':'還沒打敗（剩 '+G.hp+' 顆心）'}　最高連擊 ${G.maxCombo}`; save();
  const gained=G.res.reduce((s,r)=>s+r.pts,0)+bossBonus;
  app.innerHTML=topBar(`Day ${i+1} 結算 `)+sceneHtml('今天營業結束！')+
  `<div class="card"><h2>🎉 Day ${i+1}「${d.name}」營業結束</h2>
   <div class="msg">${defeated?`🎉 你打敗了 ${BOSSES[i][1]}「${BOSSES[i][0]}」！＋5 🪙 稀有貼紙收進圖鑑！`:`${BOSSES[i][1]}「${BOSSES[i][0]}」逃跑了…明天再來挑戰！`}</div>
   <div class="msg">一次就對：${first} / ${d.items.length} 位　　${'⭐'.repeat(stars)||'再接再厲'}　最高連擊 🔥${G.maxCombo}<br>今天賺了 🪙 ${gained}（目前共 ${SAVE.coins}）</div>
   <div class="msg"><b>給 Qian 的紀錄</b>（按「複製」貼到 Discord）：</div>
   <textarea class="report" id="rep" readonly>${esc(SAVE.log[i])}</textarea>
   <p><button class="btn blue" onclick="copyText(document.getElementById('rep').value)">📋 複製紀錄</button>
   <button class="btn" onclick="viewShop()">🛒 去商店</button>
   ${i+1<DAYS.length?`<button class="btn green" onclick="startDay(${i+1})">▶ 下一天</button>`:''}
   <button class="btn gray" onclick="startDay(${i})">🔁 再玩一次</button>
   <button class="btn gray" onclick="viewMenu()">回選單</button></p></div>`;
}
function viewAllReport(){
  const keys=Object.keys(SAVE.log).map(Number).sort((a,b)=>a-b);
  let t=keys.map(k=>SAVE.log[k]).join('\n\n'); if(!t) t='還沒有紀錄，先玩一天吧！';
  if(t.length>1900) t=t.slice(t.length-1900);
  app.innerHTML=topBar()+sceneHtml()+`<div class="card"><h2>📋 全部紀錄</h2><textarea class="report" id="rep" readonly>${esc(t)}</textarea>
  <p><button class="btn blue" onclick="copyText(document.getElementById('rep').value)">📋 複製</button>
  <button class="btn gray" onclick="viewMenu()">回選單</button>
  <button class="btn gray" onclick="resetAll()">🗑️ 清除存檔（老師用）</button></p></div>`;
}
function resetAll(){ if(confirm('確定要清除所有進度和金幣嗎？')){ SAVE={coins:0,bought:[],done:{},log:{},stickers:[],bosses:[]}; save(); viewMenu(); } }
function copyText(t){
  const done=()=>toast('已複製 ✅');
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t)); return; } }catch(e){}
  fallbackCopy(t);
}
function fallbackCopy(t){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');toast('已複製 ✅');}catch(e){toast('請手動選取複製');} ta.remove(); }

/* ====================== 圖鑑 ====================== */
function viewAlbum(){
  app.innerHTML=topBar()+sceneHtml('客人圖鑑')+`<div class="card"><h2>📒 客人圖鑑</h2><div class="msg">每答對一位客人，就能把他收進圖鑑！打敗 Boss 還有稀有貼紙。</div>
  ${DAYS.map((d,di)=>`<div class="msg"><b>Day ${di+1} ${d.name}</b>　${SAVE.bosses.includes(di)?BOSSES[di][1]+' ✅':'❓ Boss'}<br>${d.items.map((q,qi)=>SAVE.stickers.includes(di+'-'+qi)?`<span style="font-size:34px" title="${CUSTOMERS[(di*3+qi)%CUSTOMERS.length][0]}">${CUSTOMERS[(di*3+qi)%CUSTOMERS.length][1]}</span>`:'<span style="font-size:34px;opacity:.35">❓</span>').join(' ')}</div>`).join('')}
  <p><button class="btn gray" onclick="viewMenu()">回選單</button></p></div>`;
}
/* ====================== 商店 ====================== */
function viewShop(){
  app.innerHTML=topBar()+sceneHtml()+`<div class="card"><h2>🛒 餐車商店</h2>
  ${SHOP.map((s,i)=>`<div class="shop"><span>${s[0]} ${s[1]}</span><span>${SAVE.bought.includes(i)?'✅ 已裝上':`<button class="btn green" style="font-size:16px;padding:6px 14px" ${SAVE.coins<s[2]?'disabled':''} onclick="buy(${i})">🪙 ${s[2]} 購買</button>`}</span></div>`).join('')}
  <p><button class="btn gray" onclick="viewMenu()">回選單</button></p></div>`;
}
function buy(i){ if(SAVE.coins>=SHOP[i][2]&&!SAVE.bought.includes(i)){ SAVE.coins-=SHOP[i][2]; SAVE.bought.push(i); save(); beep(true); toast('餐車變漂亮了！'); viewShop(); } }

viewMenu();
</script>
